<header class="desktop-navbar">
  <div class="navbar-container">
    <div class="nav-left">
      <a class="brand-logo" routerLink="/">
        <div class="brand-icon">
          <i class="bi bi-play-btn-fill"></i>
        </div>
      </a>


      <nav class="nav-menu">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="bi bi-house-door"></i> Início
        </a>
        <a class="nav-link" routerLink="/" fragment="movies">
          <i class="bi bi-film"></i> Filmes
        </a>
        <a class="nav-link" routerLink="/" fragment="series">
          <i class="bi bi-tv"></i> Séries
        </a>
      </nav>
    </div>

    <div class="nav-controls">

      <form class="search-box" (submit)="onSearchSubmit($event)">
        <i class="bi bi-search search-box-icon"></i>
        <input type="text" class="search-input" placeholder="Buscar filmes, séries..." [value]="searchQuery()"
          (input)="onSearchInput($event)" />
      </form>

      <button class="user-avatar-btn" aria-label="Perfil de usuário">
        <i class="bi bi-person-fill"></i>
      </button>

    </div>
  </div>
</header>

<nav class="mobile-tab-bar" aria-label="Navegação mobile">
  <div class="tab-bar-container">
    <a class="tab-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <div class="tab-icon-wrap">
        <i class="bi bi-house-door-fill tab-icon-active"></i>
        <i class="bi bi-house-door tab-icon-inactive"></i>
      </div>
      <span class="tab-label">Início</span>
    </a>

    <a class="tab-item" routerLink="/" fragment="movies">
      <div class="tab-icon-wrap">
        <i class="bi bi-film tab-icon-active"></i>
        <i class="bi bi-film tab-icon-inactive"></i>
      </div>
      <span class="tab-label">Filmes</span>
    </a>

    <a class="tab-item" routerLink="/" fragment="series">
      <div class="tab-icon-wrap">
        <i class="bi bi-tv-fill tab-icon-active"></i>
        <i class="bi bi-tv tab-icon-inactive"></i>
      </div>
      <span class="tab-label">Séries</span>
    </a>

    <button class="tab-item" type="button" (click)="toggleSearch()" [class.active]="searchOpen()">
      <div class="tab-icon-wrap">
        <i class="bi bi-search tab-icon-active"></i>
        <i class="bi bi-search tab-icon-inactive"></i>
      </div>
      <span class="tab-label">Buscar</span>
    </button>

    <a class="tab-item" routerLink="/conta">
      <div class="tab-icon-wrap">
        <i class="bi bi-person-fill tab-icon-active"></i>
        <i class="bi bi-person tab-icon-inactive"></i>
      </div>
      <span class="tab-label">Conta</span>
    </a>

  </div>
</nav>

@if (searchOpen()) {
<div class="mobile-search-overlay" (click)="closeSearch()">
  <div class="mobile-search-card" (click)="$event.stopPropagation()">
    <div class="mobile-search-header">
      <div class="mobile-search-input-wrap">
        <i class="bi bi-search"></i>
        <input type="text" class="mobile-search-input" placeholder="Buscar títulos, gêneros..." [value]="searchQuery()"
          (input)="onSearchInput($event)" />
      </div>
      <button class="mobile-search-cancel" type="button" (click)="closeSearch()">
        Cancelar
      </button>
    </div>
  </div>
</div>
}
