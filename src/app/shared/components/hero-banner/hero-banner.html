<section class="hero">
  <div
    class="hero__backdrop"
    [style.background-image]="backgroundImage()"
  ></div>
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <span class="hero__featured mb-4"><i class="bi bi-star-fill"></i> Em destaque</span>
    <h1 class="hero__title">{{ item().title }}</h1>
    <div class="hero__meta mt-3">
      <span class="hero__rating"><i class="bi bi-star-fill"></i> {{ rating() }}</span>
      <span>&middot; {{ item().year }}</span>
      <span class="dot">&middot;</span>
      <span>{{ item().type === 'movie' ? 'Filme' : 'Série' }}</span>
      <span class="dot">&middot;</span>
      <span>{{ item().genres.join(' · ') }}</span>
    </div>
    <p class="hero__overview">{{ item().overview }}</p>
    <div class="hero__actions">
      <button class="hero__btn hero__btn--primary" [routerLink]="['/watch', item().type, item().id]" type="button">
        <i class="bi bi-play-fill"></i> Assistir agora
      </button>
    </div>
  </div>
  <div class="hero__fade"></div>
</section>
