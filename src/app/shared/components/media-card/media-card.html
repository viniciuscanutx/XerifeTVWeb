<div class="poster-card" [routerLink]="['/watch', item().type, item().id]" tabindex="0">
  <div class="poster-card__image-wrap">
    <img [src]="item().poster" [alt]="item().title" loading="lazy" />
    <span class="poster-card__badge">{{ item().type === 'movie' ? 'Filme' : 'Série' }}</span>
    <span class="poster-card__year">{{ item().year }}</span>
    <div class="poster-card__overlay">
      <div class="poster-card__info">
        <h6 class="poster-card__title">{{ item().title }}</h6>
        <div class="poster-card__meta">
          <span class="rating"><i class="bi bi-star-fill"></i> {{ item().rating.toFixed(1) }}</span>
        </div>
        <p class="poster-card__overview">{{ item().overview }}</p>
        <div class="poster-card__genres">
          @for (g of item().genres; track g) {
            <span class="genre-tag">{{ g }}</span>
          }
        </div>
        <div class="poster-card__actions">
          <button class="btn-play" type="button">
            <i class="bi bi-play-fill"></i> Assistir
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
