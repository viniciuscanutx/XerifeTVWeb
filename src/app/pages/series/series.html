<main class="catalog-page animate-page-enter">
  <app-filter-bar
    title="Séries"
    [count]="filteredSeries().length"
    countLabel="títulos"
    [options]="categoryOptions()"
    [(selected)]="selectedCategory"
    allLabel="Todos os gêneros"
    [searchable]="true"
    [(searchTerm)]="searchTerm"
    searchPlaceholder="Buscar série..."
    [sortOptions]="sortOptions"
    [(sortValue)]="sortBy"
  />

  <!-- Content Grid -->
  @if (loading()) {
    <div class="page-loading-wrapper">
      <div class="spinner-purple"></div>
      <p>Carregando séries...</p>
    </div>
  }
  @else if (filteredSeries().length === 0) {
    <div class="catalog-state">
      Nenhuma série encontrada.
    </div>
  }
  @else {
    <div class="catalog-grid">
      @for (item of filteredSeries(); track item.id) {
        <div class="grid-item">
          <app-media-card [item]="item" />
        </div>
      }
    </div>
  }
</main>
