@if (loading()) {
  <div class="home-content">
    <p class="no-results"><i class="bi bi-hourglass-split"></i> Carregando...</p>
  </div>
} @else if (error()) {
  <div class="home-content">
    <p class="no-results"><i class="bi bi-emoji-frown"></i> {{ error() }}</p>
  </div>
} @else if (hasData()) {
  <app-hero-banner [item]="heroItem()!" />

  <div class="home-content">
    <app-media-carousel
      title="Em alta esta semana"
      icon="bi-graph-up-arrow"
      [items]="trending()"
    />

    <app-media-carousel
      title="Top filmes"
      icon="bi-trophy-fill"
      [items]="movies()"
    />

    <app-media-carousel
      title="Séries imperdíveis"
      icon="bi-tv-fill"
      [items]="series()"
    />

    <app-media-carousel
      title="Melhores avaliados"
      icon="bi-star-fill"
      [items]="topRated()"
    />
  </div>
}
