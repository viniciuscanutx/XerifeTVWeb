<fieldset class="badge-field" aria-describedby="profile-badges-help">
  <legend>Badge do perfil</legend>
  <p id="profile-badges-help">Escolha qual dos seus badges aparece junto ao seu nome.</p>
  @if (badges().length) {
    <div class="badge-options">
      <label [class.selected]="selected() === null">
        <input type="radio" name="profileBadge" [checked]="selected() === null" (change)="selected.set(null)" />
        Não exibir badge
      </label>
      @for (badge of badges(); track badge.id) {
        <label [class.selected]="selected() === badge.id">
          <input type="radio" name="profileBadge" [checked]="selected() === badge.id" (change)="selected.set(badge.id)" />
          <app-profile-badge [badge]="badge" />
        </label>
      }
    </div>
  } @else {
    <p class="badge-empty">
      <i class="bi bi-award" aria-hidden="true"></i> Você ainda não recebeu badges.
    </p>
  }
</fieldset>
