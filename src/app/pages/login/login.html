<main class="login-wrapper animate-page-enter">
  <div class="login-content">

    <div class="brand-glow-icon">
      <i class="bi bi-play-btn-fill"></i>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email"
          [attr.aria-invalid]="email.invalid && email.touched" aria-describedby="email-error" />
        @if (email.invalid && email.touched) {
        <span id="email-error" class="field-error" aria-live="polite">
          Informe um e-mail válido.
        </span>
        }
      </div>

      <div class="form-field">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password"
          [attr.aria-invalid]="password.invalid && password.touched" aria-describedby="password-error" />
        @if (password.invalid && password.touched) {
        <span id="password-error" class="field-error" aria-live="polite">
          Informe sua senha.
        </span>
        }
      </div>

      @if (errorMessage()) {
      <p class="form-error" role="alert" aria-live="polite">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-login" [disabled]="form.invalid || isLoading()">
        @if (isLoading()) {
        <i class="bi bi-hourglass-split"></i> Entrando...
        } @else {
        Entrar
        }
      </button>
    </form>
  </div>
</main>
